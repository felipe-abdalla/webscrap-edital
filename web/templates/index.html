<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGate</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 + Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Estilos do WebGate -->
  <link href="{{ url_for('static', filename='css/base.css') }}" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/layout.css') }}" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/components.css') }}" rel="stylesheet" />
</head>
<body>

<header class="site-header">
  <div class="container-xxl">
    <h1>Web<span>Gate</span></h1>
    <p>Encontre editais que podem fazer sua ideia ganhar vida</p>
  </div>
</header>

<main class="site-main">
  <div class="container-xxl">
    <section class="board" aria-labelledby="board-title">
      <div class="board-toolbar">
        <div>
          <h2 class="board-title" id="board-title">
            <i class="bi bi-grid-3x2-gap me-1"></i> Editais encontrados
            <span id="board-count"></span>
          </h2>
          <div class="board-status" id="board-status"></div>
        </div>
        <button class="btn-update" id="update-btn" type="button">
          <i class="bi bi-arrow-clockwise"></i> Atualizar
        </button>
      </div>

      <!-- 1 coluna no celular, 2 a partir de 576px, 3 a partir de 992px, 4 a partir de 1400px -->
      <div id="cards" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xxl-4 g-3" aria-live="polite"></div>
    </section>
  </div>
</main>

<div id="toast-wrap"></div>

<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
